name: Midoku IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midoku-merged-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify collection domain
        run: |
          mkdir -p build/artifacts
          set -o pipefail
          xcodebuild -version
          swift test 2>&1 | tee build/domain-tests.log
      - name: Archive unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project Midoku.xcodeproj -scheme Midoku -configuration Release \
            -destination 'generic/platform=iOS' archive \
            -archivePath build/Midoku.xcarchive -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/archive.log
      - name: Simulator integration tests
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for r,v in d["devices"].items() if "iOS-27" in r for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild test -project Midoku.xcodeproj -scheme Midoku -configuration Debug \
            -destination "id=$device_id" -derivedDataPath build/Simulator \
            -only-testing:MidokuTests/CollectionIntegrationTests -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/integration-tests.log
          app="$PWD/build/Simulator/Build/Products/Debug-iphonesimulator/Midoku.app"
          # Xcode can shut down the destination after running tests on a clone.
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$app"
          mkdir -p build/screenshots
          xcrun simctl ui "$device_id" appearance dark
          for screen in collection empty history compact entry chapter-default chapter-compact chapter-clean chapter-selection appearance accent reader reader-hidden; do
            xcrun simctl terminate "$device_id" com.raahat.Midoku || true
            xcrun simctl launch "$device_id" com.raahat.Midoku --collection-preview "--$screen-preview"
            sleep 8
            xcrun simctl io "$device_id" screenshot "build/screenshots/$screen.png"
          done
          xcrun simctl terminate "$device_id" com.raahat.Midoku || true
      - name: Package IPA
        run: |
          mkdir -p build/package/Payload build/artifacts
          app=build/Midoku.xcarchive/Products/Applications/Midoku.app
          test -s "$app/Midoku"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.raahat.Midoku
          file "$app/Midoku"
          ditto "$app" build/package/Payload/Midoku.app
          (cd build/package && zip -qry ../artifacts/Midoku-merged-unsigned.ipa Payload)
          unzip -t build/artifacts/Midoku-merged-unsigned.ipa
          (cd build/artifacts && shasum -a 256 Midoku-merged-unsigned.ipa > SHA256SUMS.txt)
          printf 'Commit: %s\nUnsigned iOS 27 device build for LiveContainer.\n' "$GITHUB_SHA" > build/artifacts/BUILD.txt
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Midoku-merged-unsigned-${{ github.sha }}
          path: build/artifacts/
          if-no-files-found: error
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Midoku-merged-validation-${{ github.sha }}
          path: |
            build/screenshots/
            build/*.log
          if-no-files-found: ignore
