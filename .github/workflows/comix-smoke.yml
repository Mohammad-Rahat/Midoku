name: Comix live protocol check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Tools/comix-smoke.swift', 'Midoku/Extensions/Core/SourceBrowserRules.swift', '.github/workflows/comix-smoke.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read safe catalogue and report protocol shape
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          cat Midoku/Extensions/Core/SourceBrowserRules.swift Tools/comix-smoke.swift > "$RUNNER_TEMP/comix-smoke.swift"
          swift "$RUNNER_TEMP/comix-smoke.swift"
