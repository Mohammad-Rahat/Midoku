name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Midoku/**'
      - 'Midoku.xcodeproj/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -list -project Midoku.xcodeproj

      - name: Run Swift tests
        run: swift test

      - name: Archive for iOS
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project Midoku.xcodeproj \
            -scheme Midoku \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Midoku.xcarchive" \
            -resultBundlePath "$PWD/build/Archive.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build/archive.log

      - name: Package unsigned IPA
        run: |
          app="$PWD/build/Midoku.xcarchive/Products/Applications/Midoku.app"
          test -d "$app"
          test -s "$app/Midoku"
          file "$app/Midoku"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist"
          mkdir -p build/package/Payload build/artifacts
          ditto "$app" build/package/Payload/Midoku.app
          (cd build/package && /usr/bin/zip -qry ../artifacts/Midoku-unsigned.ipa Payload)
          unzip -t build/artifacts/Midoku-unsigned.ipa
          (cd build/artifacts && shasum -a 256 Midoku-unsigned.ipa > SHA256SUMS.txt)
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            xcodebuild -version
            printf '\nUnsigned iOS device build. Sign with a valid Apple identity and provisioning profile before installation.\n'
          } > build/artifacts/BUILD.txt

      - name: Build and capture simulator screens
        run: |
          set -o pipefail
          xcodebuild build -project Midoku.xcodeproj -scheme Midoku -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/build/Simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build/simulator.log 2>&1
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          app="$PWD/build/Simulator/Build/Products/Debug-iphonesimulator/Midoku.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$device_id" "$app"
          mkdir -p build/screenshots
          for screen in library entry settings; do
            xcrun simctl terminate "$device_id" "$bundle_id" || true
            xcrun simctl launch "$device_id" "$bundle_id" --library-preview "--$screen-preview"
            sleep 4
            xcrun simctl io "$device_id" screenshot "build/screenshots/$screen.png"
          done
          xcrun simctl terminate "$device_id" "$bundle_id" || true

      - name: Upload simulator screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Midoku-screenshots-${{ github.sha }}
          path: build/screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Midoku-unsigned-${{ github.sha }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload archive diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Midoku-build-diagnostics-${{ github.sha }}
          path: |
            build/archive.log
            build/simulator.log
            build/Archive.xcresult
          if-no-files-found: ignore
          retention-days: 7
