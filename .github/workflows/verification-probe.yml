name: WebKit verification diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Tools/verification-probe.swift', '.github/workflows/verification-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build bundled adapters
        working-directory: Extensions
        run: npm ci && npm run build
      - name: Observe actual WebKit frames and source verification
        run: |
          cat Midoku/Extensions/Core/ExtensionContract.swift \
              Midoku/Extensions/Core/SourceRequestPolicy.swift \
              Midoku/Extensions/Core/SourceRequestCoordinator.swift \
              Midoku/Extensions/Core/URLSessionSourceTransport.swift \
              Midoku/Extensions/Core/SourceCookiePolicy.swift \
              Midoku/Extensions/Core/SourceBrowserRules.swift \
              Midoku/Extensions/Core/SourceVerificationPolicy.swift \
              Midoku/Extensions/Core/JavaScriptExtensionRuntime.swift \
              Midoku/Extensions/Apple/BrowserSessionStore.swift \
              Midoku/Extensions/Apple/SourceBrowserRenderer.swift \
              Tools/verification-probe.swift > "$RUNNER_TEMP/verification-probe.swift"
          swift "$RUNNER_TEMP/verification-probe.swift"
